name: Build Aman Shoe Store Build50 APK
on:
  workflow_dispatch:
  push:
    branches:
      - build50-android-touch-final-fix-2026-11-27
permissions:
  contents: read
jobs:
  build:
    if: github.ref_name == 'build50-android-touch-final-fix-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build50 source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Validate Build50 touch fallback and JavaScript
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          grep -q "window.__amanTouchFallbackReady=true" app/src/main/assets/index.html
          grep -q "Android WebView fallback: replay a tap only when WebView failed to emit its native click" app/src/main/assets/index.html
          grep -q "function showSection" app/src/main/assets/index.html
          grep -q "function showWishlist" app/src/main/assets/index.html
          grep -q ".slice(0,1)" app/src/main/assets/index.html
          grep -q "function headerLogout" app/src/main/assets/index.html
          grep -q "versionCode 23" app/build.gradle
          grep -q "1.21-build50" app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text()
          parts = html.split("<script")
          scripts = []
          for part in parts[1:]:
              if ">" in part and "</script>" in part:
                  scripts.append(part.split(">", 1)[1].split("</script>", 1)[0])
          inline = chr(10).join(x for x in scripts if x.strip())
          Path("/tmp/aman-build50-inline.js").write_text(inline)
          if not inline.strip():
              raise SystemExit("No inline JavaScript found")
          PY
          node --input-type=module --check < /tmp/aman-build50-inline.js
      - name: Build Build50 APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"
      - name: Upload Build50 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build50
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
