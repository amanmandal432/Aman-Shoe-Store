name: Build Aman Shoe Store Build54 APK
on:
  workflow_dispatch:
  push:
    branches:
      - build54-banner-admin-return-fix-2026-11-27
permissions:
  contents: write
jobs:
  build:
    if: github.ref_name == 'build54-banner-admin-return-fix-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build54 source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Validate Build54 banner and admin return fixes
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          grep -q "window.__amanTouchFallbackReady=true" app/src/main/assets/index.html
          grep -q "window.returnToAdminDashboard" app/src/main/assets/index.html
          grep -q "admin-back-dashboard" app/src/main/assets/index.html
          grep -q "node!==target" app/src/main/assets/index.html
          grep -q "area.querySelectorAll(\":scope > .admin-panel-section\")" app/src/main/assets/index.html
          grep -q "Android WebView fallback: replay a tap only when WebView failed to emit its native click" app/src/main/assets/index.html
          grep -q "function showSection" app/src/main/assets/index.html
          grep -q "function showWishlist" app/src/main/assets/index.html
          grep -q 'filter(x=>x.image&&typeof x.image==="string")' app/src/main/assets/index.html
          grep -q 'window.returnToAdminDashboard==="function"' app/src/main/assets/index.html
          grep -q "loadAdminReviews();renderHomeCategoriesAdmin();renderAdminDashboard()" app/src/main/assets/index.html
          grep -q "function openSupportWhatsApp" app/src/main/assets/index.html
          grep -q "function callSupportPhone" app/src/main/assets/index.html
          grep -q "callPhone" app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "public void exitApp()" app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "AndroidShare.exitApp()" app/src/main/assets/index.html
          grep -q "userId:customerUser.uid" app/src/main/assets/index.html
          grep -q "Intent.ACTION_DIAL" app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "openWhatsApp" app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "lastOrderQty:u.qty" app/src/main/assets/index.html
          grep -q "function headerLogout" app/src/main/assets/index.html
          grep -q "versionCode 27" app/build.gradle
          grep -q "1.25-build54" app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text()
          parts = html.split("<script")
          scripts = []
          for part in parts[1:]:
              if ">" in part and "</script>" in part:
                  scripts.append(part.split(">", 1)[1].split("</script>", 1)[0])
          inline = chr(10).join(x for x in scripts if x.strip())
          Path("/tmp/aman-build53-inline.js").write_text(inline)
          if not inline.strip():
              raise SystemExit("No inline JavaScript found")
          PY
          node --input-type=module --check < /tmp/aman-build53-inline.js
      - name: Build Build54 APK
        run: gradle --no-daemon assembleDebug
      - name: Validate Build54 APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"
      - name: Upload Build54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build54
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish stable customer download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.25.0
          name: Aman Shoe Store 1.25
          body: |
            Aman Shoe Store Android release.
            Customers can always use the same QR code / latest download URL for future updates.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
