
name: Build Aman Shoe Store APK - Build14

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Android source
        run: |
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/amanshoestore/app/MainActivity.java

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Build14 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build14-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
