name: Build Aman Shoe Store APK - Build45 Colour Sync and Admin Lists - Final

on:
  workflow_dispatch:
  push:
    branches:
      - build41-order-permissions-direct-buy-links-2026-11-26
      - build43-color-image-gallery-fix-2026-11-26
      - build44-color-swatches-selection-2026-11-26
      - build45-color-sync-admin-lists-2026-11-26

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build45 source
        uses: actions/checkout@v4
        with:
          ref: build45-color-sync-admin-lists-2026-11-26

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Build45 source
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "openGalleryFullscreen" app/src/main/assets/index.html
          grep -q "colorImageIndex" app/src/main/assets/index.html
          grep -q "aria-pressed" app/src/main/assets/index.html
          grep -q "initialColorForGallery" app/src/main/assets/index.html
          grep -q "CSS.supports(\"color\",n)" app/src/main/assets/index.html
          grep -q "docs.slice(0,2)" app/src/main/assets/index.html

      - name: Build Build45 APK
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"

      - name: Upload Build45 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build45
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
