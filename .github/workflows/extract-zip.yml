
name: Extract Build 16 Premium ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Build 16 Premium
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Aman_Shoe_Store_Build16_Premium_Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Build16 Premium ZIP not found."
            exit 1
          fi

          mkdir -p /tmp/build16-unpack
          unzip -q "$ZIP_FILE" -d /tmp/build16-unpack

          PROJECT_ROOT="$(find /tmp/build16-unpack -maxdepth 5 -type f -name settings.gradle -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ] || [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: Android project not found in ZIP."
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. .

          rm -f "$ZIP_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Aman Shoe Store Build16 Premium"
            git push
          fi
