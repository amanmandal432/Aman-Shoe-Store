name: Build Aman Shoe Store Build46 APK
on:
  workflow_dispatch:
  push:
    branches:
      - build46-variant-stock-delivery-2026-11-27
permissions:
  contents: read
jobs:
  build:
    if: github.ref_name == 'build46-variant-stock-delivery-2026-11-27'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build46 source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Verify Build46 features
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/amanshoestore/app/MainActivity.java
          grep -q "parseVariantStock" app/src/main/assets/index.html
          grep -q "variantStock" app/src/main/assets/index.html
          grep -q "refreshVariantAvailability" app/src/main/assets/index.html
          grep -q "trackingHistory" app/src/main/assets/index.html
          grep -q "currentLocation" app/src/main/assets/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", html, re.I)
          inline = "\\n".join(x for x in scripts if x.strip())
          Path("/tmp/aman-build46-inline.js").write_text(inline)
          if not inline.strip():
              raise SystemExit("No inline JavaScript found")
          PY
          node --check /tmp/aman-build46-inline.js
      - name: Build Build46 APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"
      - name: Upload Build46 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build46
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
