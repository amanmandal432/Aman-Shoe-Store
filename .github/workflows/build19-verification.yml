name: Aman Shoe Store Build19 Verification

on:
  push:
    branches:
      - build19-final-customer-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build19 branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android project and web asset
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/amanshoestore/app/MainActivity.java
          echo "Build19 HTML bytes:"
          wc -c app/src/main/assets/index.html

      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"
          stat -c "APK size: %s bytes" "$APK"

      - name: Upload Build19 APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build19-Verification
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
