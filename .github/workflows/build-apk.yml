name: Aman Shoe Store Build25 APK - Correct Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build23-shopping-ui-2026-11-22
      - build24-professional-store-fixes-2026-11-22
      - build24-mobile-polish-2026-11-23
      - build25-amazon-category-navigation-2026-11-24
      - build26-premium-modern-ui-2026-11-24
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify actual Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/amanshoestore/app/MainActivity.java
          echo "Correct root Android project verified"
          echo "App HTML bytes:"
          wc -c app/src/main/assets/index.html

      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK from repository source
        run: gradle --no-daemon assembleDebug

      - name: Validate generated APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          stat -c "%s bytes" "$APK"
          file "$APK"
          unzip -t "$APK"
          echo "APK contents:"
          unzip -l "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "classes.dex"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-Build25-Verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
