
name: Aman Shoe Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android ZIP not found!"
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

      - name: Locate Android Project
        run: |
          ROOT=$(find android-project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -type f | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found!"
            find android-project -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$ROOT")" >> $GITHUB_ENV

      - name: Setup Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
