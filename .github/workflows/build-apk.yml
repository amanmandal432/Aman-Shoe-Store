
name: Aman Shoe Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android ZIP not found!"
            exit 1
          fi
          mkdir android-project
          unzip -q "$ZIP" -d android-project
          echo "ZIP extracted"

      - name: Locate Android Project
        run: |
          ROOT=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$ROOT")" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Shoe-Store-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
