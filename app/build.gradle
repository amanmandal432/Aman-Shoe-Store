plugins { id 'com.android.application' }

android {
    namespace 'com.amanshoestore.app'
    compileSdk 35

    defaultConfig {
        // Separate package so the recovery test APK can be installed alongside stable Build21.
        applicationId 'com.amanshoestore.app.recoverytest'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.4-build21-recovery-test'
    }
}
